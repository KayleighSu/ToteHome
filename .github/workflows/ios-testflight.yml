name: ToteHome TestFlight (signed iOS build)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ios-testflight
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in APPLE_TEAM_ID IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_KEY_P8_BASE64; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $key"
              exit 1
            fi
          done
      - name: Install and generate ToteHome iOS project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_SUPABASE_URL" && test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "::error::Missing Supabase configuration"; exit 1; }
          npm ci
          # Remove the web-only base URL from the ephemeral native build checkout.
          node -e 'const fs=require("fs"); const p="app.json"; const c=JSON.parse(fs.readFileSync(p,"utf8")); if(c.expo.experiments) delete c.expo.experiments.baseUrl; c.expo.ios.buildNumber=process.env.GITHUB_RUN_NUMBER; fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n");'
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Install Apple distribution certificate and provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/totehome-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 32)"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/totehome-distribution.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/totehome.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/totehome-distribution.p12" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          /usr/bin/security cms -D -i "$RUNNER_TEMP/totehome.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          if [ "$PROFILE_TEAM" != "$APPLE_TEAM_ID" ]; then echo "::error::Signing team does not match provisioning profile"; exit 1; fi
          cp "$RUNNER_TEMP/totehome.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$RUNNER_TEMP/totehome.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Create App Store archive
        shell: bash
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          PROJECT=$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$PROJECT" && test -n "$WORKSPACE"
          export PROJECT
          ruby -rxcodeproj <<'RUBY'
          project = Xcodeproj::Project.open(ENV.fetch('PROJECT'))
          target = project.targets.find { |t| t.product_type == 'com.apple.product-type.application' }
          abort 'Application target not found' unless target
          target.build_configurations.each do |c|
            c.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
            c.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            c.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_NAME')
            c.build_settings['CURRENT_PROJECT_VERSION'] = ENV.fetch('GITHUB_RUN_NUMBER')
          end
          project.save
          RUBY
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ToteHome.xcarchive" archive
      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>manual</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>provisioningProfiles</key><dict>
          <key>com.totehome.app</key><string>$PROFILE_NAME</string>
          </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ToteHome.xcarchive" \
            -exportPath "$RUNNER_TEMP/ToteHomeExport" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -l "$RUNNER_TEMP/ToteHomeExport/"*.ipa
          mkdir -p "$RUNNER_TEMP/verify-ipa"
          unzip -q "$RUNNER_TEMP/ToteHomeExport/"*.ipa -d "$RUNNER_TEMP/verify-ipa"
          APP_PLIST=$(find "$RUNNER_TEMP/verify-ipa/Payload" -maxdepth 2 -name Info.plist -print -quit)
          test -n "$APP_PLIST"
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")
          echo "Exported build number: $ACTUAL_BUILD (expected $GITHUB_RUN_NUMBER)"
          if [ "$ACTUAL_BUILD" != "$GITHUB_RUN_NUMBER" ]; then echo "::error::Unexpected exported build number"; exit 1; fi
      - name: Upload signed build to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APPSTORE_API_KEY_P8_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          IPA=$(find "$RUNNER_TEMP/ToteHomeExport" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA" ]; then echo "::error::No exported IPA"; exit 1; fi
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID"
      - name: Remove temporary signing materials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/totehome-distribution.p12" "$RUNNER_TEMP/totehome.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
